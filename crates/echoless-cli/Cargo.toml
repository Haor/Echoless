[package]
name = "echoless-cli"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Echoless CLI: realtime and offline reference-based AEC pipeline"

[[bin]]
name = "echoless"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
zip.workspace = true
echoless-audio-io = { path = "../echoless-audio-io" }
echoless-core = { path = "../echoless-core" }
echoless-paths = { path = "../echoless-paths" }
echoless-processors = { path = "../echoless-processors" }
hound.workspace = true
cpal = "0.17"
ringbuf = "0.5"
ctrlc = { version = "3", features = ["termination"] }
